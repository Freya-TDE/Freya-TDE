# egui – UI-Backend für Zielprojekte / UI backend for target projects
#
# Immediate Mode mit eframe: egui zeichnet jedes Bild neu aus dem Zustand des
# Formulars. Jedes Widget ist ein Feld `crate::app::Control<T>` (Wert, Beschriftung,
# Einträge, enabled, visible, tooltip); Handler ändern das Widget, indem sie den
# Zustand ändern (`self.ok_button.enabled = false`).
# Immediate mode with eframe: every widget is a `Control<T>` state field; handlers
# change widgets by changing that state.

[pack]
name = "egui"
version = "0.1.0"
kind = "backend"
description = "egui with eframe: immediate-mode UI on Linux, Windows, macOS (and web)"
authors = ["Dragon Software <info@dragon-software.net>"]
license = "MIT OR Apache-2.0"
generated-code-license = "MIT OR Apache-2.0"

[backend]
event-loop = "main-thread"
absolute-positioning = true
platforms = ["linux", "windows", "macos"]
cargo = [{ crate = "eframe", version = "0.37" }]
app-file = "templates/app.rs.j2"
form-file = "templates/form.rs.j2"
run-file = "templates/run.rs.j2"

# --- Kern-Widgets / core widgets ----------------------------------------------------------

[[extend]]
type = "core/Form"
[extend.codegen]
type = "crate::app::Control<()>"
init = "crate::app::Control::new(()).with_caption({{ rust.title }}).with_state({{ rust.enabled }}, true, {{ rust.tooltip }})"

[[extend]]
type = "core/Container"
[extend.codegen]
type = "crate::app::Control<()>"
init = "crate::app::Control::new(()).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[extend]]
type = "core/Label"
[extend.properties.wrap]
type = "bool"
category = "Appearance"
description = "Wrap long text into several lines"
[extend.codegen]
type = "crate::app::Control<String>"
init = "crate::app::Control::new({{ rust.text }}.to_string()).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[extend]]
type = "core/Button"
[extend.codegen]
type = "crate::app::Control<()>"
init = "crate::app::Control::new(()).with_caption({{ rust.caption }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[extend]]
type = "core/Edit"
[extend.properties.max_length]
type = "int"
min = 0
default = 0
category = "Behavior"
description = "Maximum number of characters (0 = no limit)"
[extend.codegen]
type = "crate::app::Control<String>"
init = "crate::app::Control::new({{ rust.text }}.to_string()).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[extend]]
type = "core/CheckBox"
[extend.codegen]
type = "crate::app::Control<bool>"
init = "crate::app::Control::new({{ rust.checked }}).with_caption({{ rust.caption }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

# --- egui-Palette / egui palette ----------------------------------------------------------

[[component]]
name = "RadioButton"
kind = "widget"
look = "radio"
category = "egui"
icon = "radio"
description = "Option button; radio buttons in the same container form a group"
[component.properties.caption]
type = "text"
default = "Option"
category = "Appearance"
[component.properties.checked]
type = "bool"
category = "Behavior"
[component.events.on_toggle]
params = [{ name = "checked", type = "bool" }]
description = "Chosen by the user"
[component.codegen]
type = "crate::app::Control<bool>"
init = "crate::app::Control::new({{ rust.checked }}).with_caption({{ rust.caption }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[component]]
name = "Switch"
kind = "widget"
look = "switch"
category = "egui"
icon = "switch"
description = "On/off switch"
[component.properties.active]
type = "bool"
category = "Behavior"
[component.events.on_toggle]
params = [{ name = "active", type = "bool" }]
[component.codegen]
type = "crate::app::Control<bool>"
init = "crate::app::Control::new({{ rust.active }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[component]]
name = "DragValue"
kind = "widget"
look = "spin"
category = "egui"
icon = "spin"
description = "Number input: drag or type"
[component.properties.value]
type = "float"
category = "Value"
[component.properties.minimum]
type = "float"
category = "Value"
[component.properties.maximum]
type = "float"
default = 100.0
category = "Value"
[component.properties.step]
type = "float"
default = 1.0
category = "Value"
description = "Change per pixel dragged"
[component.properties.digits]
type = "int"
min = 0
max = 20
category = "Appearance"
description = "Decimal places shown"
[component.events.on_change]
params = [{ name = "value", type = "f64" }]
[component.codegen]
type = "crate::app::Control<f64>"
init = "crate::app::Control::new({{ rust.value }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[component]]
name = "Slider"
kind = "widget"
look = "slider"
category = "egui"
icon = "slider"
description = "Slider to choose a value"
[component.properties.value]
type = "float"
category = "Value"
[component.properties.minimum]
type = "float"
category = "Value"
[component.properties.maximum]
type = "float"
default = 100.0
category = "Value"
[component.properties.step]
type = "float"
default = 1.0
category = "Value"
[component.properties.show_value]
type = "bool"
default = true
category = "Appearance"
description = "Show the current value next to the slider"
[component.events.on_change]
params = [{ name = "value", type = "f64" }]
[component.codegen]
type = "crate::app::Control<f64>"
init = "crate::app::Control::new({{ rust.value }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[component]]
name = "ProgressBar"
kind = "widget"
look = "progress"
category = "egui"
icon = "progress"
description = "Shows the progress of a task"
[component.properties.fraction]
type = "float"
min = 0.0
max = 1.0
category = "Value"
description = "Progress from 0.0 to 1.0"
[component.properties.text]
type = "text"
category = "Appearance"
description = "Text on the bar (empty = none)"
[component.codegen]
type = "crate::app::Control<f32>"
init = "crate::app::Control::new({{ rust.fraction }} as f32).with_caption({{ rust.text }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[component]]
name = "ComboBox"
kind = "widget"
look = "dropdown"
category = "egui"
icon = "dropdown"
description = "Choose one entry from a list"
[component.properties.items]
type = "list"
item = "text"
category = "Value"
description = "The entries"
[component.properties.selected]
type = "int"
min = 0
category = "Value"
description = "Index of the selected entry"
[component.events.on_select]
params = [{ name = "index", type = "u32" }]
[component.codegen]
type = "crate::app::Control<usize>"
init = "crate::app::Control::new({{ props.selected }}usize).with_items::<&str>({{ rust.items }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[component]]
name = "ListBox"
kind = "widget"
look = "list"
category = "egui"
icon = "list"
description = "List of text entries to choose from"
[component.properties.items]
type = "list"
item = "text"
category = "Value"
[component.properties.selected]
type = "int"
min = -1
default = -1
category = "Value"
description = "Index of the selected entry (-1 = none)"
[component.events.on_select]
params = [{ name = "index", type = "i32" }]
description = "Selection changed"
[component.codegen]
type = "crate::app::Control<i32>"
init = "crate::app::Control::new({{ props.selected }}i32).with_items::<&str>({{ rust.items }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[component]]
name = "TextEdit"
kind = "widget"
look = "memo"
category = "egui"
icon = "memo"
description = "Multi-line text"
[component.properties.text]
type = "text"
category = "Appearance"
[component.properties.rows]
type = "int"
min = 1
default = 4
category = "Appearance"
description = "Visible lines"
[component.properties.read_only]
type = "bool"
category = "Behavior"
[component.properties.monospace]
type = "bool"
category = "Appearance"
[component.events.on_change]
params = [{ name = "text", type = "&str" }]
[component.codegen]
type = "crate::app::Control<String>"
init = "crate::app::Control::new({{ rust.text }}.to_string()).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[component]]
name = "Hyperlink"
kind = "widget"
look = "link"
category = "egui"
icon = "link"
description = "Opens a web address in the browser"
[component.properties.uri]
type = "text"
default = "https://example.org"
category = "Behavior"
[component.properties.caption]
type = "text"
category = "Appearance"
description = "Text (empty = the address)"
[component.codegen]
type = "crate::app::Control<String>"
init = "crate::app::Control::new({{ rust.uri }}.to_string()).with_caption({{ rust.caption }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[component]]
name = "Separator"
kind = "widget"
look = "separator"
category = "egui"
icon = "separator"
description = "A line between widgets"
[component.properties.vertical]
type = "bool"
category = "Appearance"
[component.codegen]
type = "crate::app::Control<()>"
init = "crate::app::Control::new(()).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[component]]
name = "CollapsingHeader"
kind = "container"
look = "frame"
category = "egui"
icon = "frame"
description = "Container with a title that folds its content away"
[component.properties.title]
type = "text"
default = "Details"
category = "Appearance"
[component.properties.open]
type = "bool"
default = true
category = "Behavior"
description = "Open at the start"
[component.codegen]
type = "crate::app::Control<()>"
init = "crate::app::Control::new(()).with_caption({{ rust.title }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[component]]
name = "Tabs"
kind = "container"
look = "tabs"
category = "egui"
icon = "tabs"
description = "Pages with tabs; every child is one page (usually a Container)"
[component.properties.pages]
type = "list"
item = "text"
category = "Appearance"
description = "Tab titles, one per child (missing ones: the child's name)"
[component.properties.page]
type = "int"
min = 0
category = "Behavior"
description = "The page shown at the start (and in the designer)"
[component.events.on_page]
params = [{ name = "page", type = "u32" }]
[component.codegen]
type = "crate::app::Control<usize>"
init = "crate::app::Control::new({{ props.page }}usize).with_items::<&str>({{ rust.pages }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[component]]
name = "MainMenu"
look = "menubar"
category = "egui"
icon = "menu"
description = "Menu bar of the window: entries like `Datei/Öffnen | Ctrl+O`, `Datei/-` (separator)"
[component.properties.items]
type = "list"
item = "text"
category = "Menu"
description = "One entry per line: path with `/`, optional `| shortcut`, `-` = separator"
[component.events.on_select]
params = [{ name = "item", type = "&str" }]
description = "An entry was chosen; `item` is its path, e.g. `Datei/Öffnen`"
[component.codegen]
type = "crate::app::Control<()>"
init = "crate::app::Control::new(()).with_items::<&str>({{ rust.items }})"
