[[component]]
name = "MainMenu"
look = "menubar"
category = "GTK"
icon = "menu"
description = "Menu bar of the window: entries like `Datei/Öffnen | Ctrl+O`, `Datei/-` (separator)"
[component.properties.items]
type = "list"
item = "text"
category = "Menu"
description = "One entry per line: path with `/`, optional `| shortcut`, `-` = separator"
[component.events.on_select]
params = [{ name = "item", type = "&str" }]
description = "An entry was chosen; `item` is its path, e.g. `Datei/Öffnen`"
[component.codegen]
type = "gtk4::PopoverMenuBar"
init = """{
    // Menüs aus den Pfaden: `Datei/Öffnen | Ctrl+O`; `-` beginnt einen Abschnitt.
    let bar = gtk4::gio::Menu::new();
    let mut menus: Vec<(String, gtk4::gio::Menu, gtk4::gio::Menu)> = Vec::new();
    let items: Vec<&str> = {{ rust.items }};
    for (index, entry) in items.iter().enumerate() {
        let path = entry.split('|').next().unwrap_or("").trim();
        let parts: Vec<&str> = path.split('/').map(str::trim).collect();
        if parts.len() < 2 {
            continue;
        }
        let mut parent: Option<usize> = None;
        for depth in 0..parts.len() - 1 {
            let key = parts[..=depth].join("/");
            let found = menus.iter().position(|(k, _, _)| *k == key);
            let at = match found {
                Some(at) => at,
                None => {
                    let menu = gtk4::gio::Menu::new();
                    let section = gtk4::gio::Menu::new();
                    menu.append_section(None, &section);
                    match parent {
                        None => bar.append_submenu(Some(parts[depth]), &menu),
                        Some(p) => menus[p].2.append_submenu(Some(parts[depth]), &menu),
                    }
                    menus.push((key, menu, section));
                    menus.len() - 1
                }
            };
            parent = Some(at);
        }
        let Some(at) = parent else { continue };
        let label = parts[parts.len() - 1];
        if label == "-" {
            let section = gtk4::gio::Menu::new();
            menus[at].1.append_section(None, &section);
            menus[at].2 = section;
        } else {
            menus[at].2.append(Some(label), Some(&format!("{{ name }}.item{index}")));
        }
    }
    gtk4::PopoverMenuBar::from_model(Some(&bar))
}"""

