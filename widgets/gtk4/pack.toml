# GTK 4 – UI-Backend für Zielprojekte / UI backend for target projects
#
# Erzeugt echte GTK-4-Fenster mit gtk4-rs. Jedes Widget ist ein Feld des
# Formular-Structs (z. B. `self.ok_button: gtk4::Button`), die Handler bekommen
# `&mut self` und können die Widgets direkt ansprechen.
# Generates real GTK 4 windows with gtk4-rs; every widget is a field of the
# form struct, handlers get `&mut self` and use the widgets directly.
#
# Ablauf / flow: `setup` initialisiert GTK, `App::init` erzeugt die Widgets,
# `run` legt jedes Formular in ein `Rc<RefCell<…>>`, baut das Layout auf
# (`build_ui`), verbindet die Ereignisse (`start`) und zeigt das erste Formular;
# schließt es, endet das Programm.

[pack]
name = "gtk4"
version = "0.1.0"
kind = "backend"
description = "GTK 4 (gtk4-rs): native widgets on Linux, Windows and macOS"
authors = ["Dragon Software <info@dragon-software.net>"]
license = "MIT OR Apache-2.0"
generated-code-license = "MIT OR Apache-2.0"

[backend]
event-loop = "main-thread"
absolute-positioning = true
platforms = ["linux", "windows", "macos"]
# v4_12: Picture::set_content_fit, FlowBox::remove_all (ImageBox, ImageScrollBox).
cargo = [{ crate = "gtk4", version = "0.11", features = ["v4_12"] }]
setup = "gtk4::init()?;"
form-file = "templates/form.rs.j2"
run-file = "templates/run.rs.j2"

# --- Kern-Widgets / core widgets ----------------------------------------------------------

[[extend]]
type = "core/Form"
[extend.codegen]
type = "gtk4::Window"
init = """{
    use gtk4::prelude::*;
    let window = gtk4::Window::new();
    window.set_title(Some({{ rust.title }}));
    window.set_default_size({{ props.size.width }}, {{ props.size.height }});
    window.set_resizable({{ rust.resizable }});
    window.set_sensitive({{ rust.enabled }});
    {%- if props.tooltip %}
    window.set_tooltip_text(Some({{ rust.tooltip }}));
    {%- endif %}
    window
}"""

