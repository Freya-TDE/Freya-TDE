# freya – UI-Backend für Zielprojekte / UI backend for target projects
#
# Freya (https://freyaui.dev, Marc Espín, MIT) ist ein eigenständiges Projekt und hat
# nichts mit Freya TDE zu tun; Freya TDE unterstützt es nur als UI-Backend.
# Freya (https://freyaui.dev, by Marc Espín, MIT) is an independent project and has
# nothing to do with Freya TDE; Freya TDE only supports it as a UI backend.
#
# Reaktiv wie React: der Zustand des Formulars liegt in `Rc<RefCell<…>>`, jedes Widget
# ist ein Feld `crate::app::Control<T>`; eine Eingabe wird eine Nachricht
# (`main_form::Message`), `update` ändert den Zustand und ruft die Handler, danach
# zeichnet freya neu. Die Oberfläche baut `freya_view` mit den Elementen von freya.
# Reactive: the form state lives in `Rc<RefCell<…>>`; every input becomes a message,
# `update` changes the state and calls the handlers, then freya renders again.

[pack]
name = "freya-gui"
version = "0.1.0"
kind = "backend"
title = "freya"
description = "freya (freyaui.dev): declarative Rust GUI powered by Skia (Linux, Windows, macOS); an independent project, see the notice"
authors = ["Dragon Software <info@dragon-software.net>"]
license = "MIT OR Apache-2.0"
generated-code-license = "MIT OR Apache-2.0"
license-notice = """
freya (https://freyaui.dev) is an independent open-source project by Marc Espín
(github.com/marc2332/freya). It has nothing to do with Freya TDE: despite the similar
name, Freya TDE is neither part of freya nor made, endorsed or supported by its authors.
Freya TDE only supports freya as one of its UI backends.

freya is licensed under the MIT license. Only your generated project depends on it;
Freya TDE does not use freya itself. The code generated by Freya TDE is yours
(MIT OR Apache-2.0).

Questions about freya itself: https://freyaui.dev and https://github.com/marc2332/freya
"""

[backend]
event-loop = "main-thread"
absolute-positioning = true
platforms = ["linux", "windows", "macos"]
cargo = [
  { crate = "freya", version = "0.5.4" },
  { crate = "futures-channel", version = "0.3" },
  { crate = "futures-util", version = "0.3" },
  # Schalter am Formular bzw. an Widgets schalten Features von freya ein.
  { crate = "freya", version = "0.5.4", features = ["borderless"], when = { decorations = false } },
  { crate = "freya", version = "0.5.4", features = ["titlebar"], when = { custom_titlebar = true } },
  { crate = "freya", version = "0.5.4", features = ["zoom-shortcuts"], when = { zoom_shortcuts = true } },
  { crate = "freya", version = "0.5.4", features = ["devtools"], when = { devtools = true } },
  { crate = "freya", version = "0.5.4", features = ["metrics"], when = { metrics = true } },
  { crate = "freya", version = "0.5.4", features = ["hotreload"], when = { hot_reload = true } },
  { crate = "freya", version = "0.5.4", features = ["material-design"], when = { ripple = true } },
  { crate = "freya", version = "0.5.4", features = ["remote-asset"], uses = { file = "://" } },
  { crate = "freya", version = "0.5.4", features = ["radio"], when = { radio = true } },
  { crate = "freya", version = "0.5.4", features = ["query"], when = { query = true } },
  { crate = "freya", version = "0.5.4", features = ["sdk-tokio"], when = { sdk = true } },
]
app-file = "templates/app.rs.j2"
form-file = "templates/form.rs.j2"
run-file = "templates/run.rs.j2"

# Stil, Animation und Ereignisse, die jedes Widget unter freya bekommt.
# Style, animation and events every widget gets under freya.
[backend.widget-properties.corner_radius]
type = "int"
min = 0
max = 500
category = "Style"
description = "Rounded corners in pixels"
[backend.widget-properties.border_width]
type = "int"
min = 0
max = 100
category = "Style"
[backend.widget-properties.border_color]
type = "color"
default = "#00000000"
category = "Style"
[backend.widget-properties.shadow_blur]
type = "int"
min = 0
max = 200
category = "Style"
description = "Shadow blur in pixels (0 = no shadow)"
[backend.widget-properties.shadow_x]
type = "int"
category = "Style"
[backend.widget-properties.shadow_y]
type = "int"
default = 2
category = "Style"
[backend.widget-properties.shadow_color]
type = "color"
default = "#00000055"
category = "Style"
[backend.widget-properties.gradient]
type = "enum"
variants = ["None", "Linear", "Radial", "Conic"]
default = "None"
category = "Style"
description = "Background gradient instead of a plain background"
[backend.widget-properties.gradient_from]
type = "color"
default = "#3b82f6"
category = "Style"
[backend.widget-properties.gradient_to]
type = "color"
default = "#9333ea"
category = "Style"
[backend.widget-properties.gradient_angle]
type = "int"
min = 0
max = 360
default = 90
category = "Style"
[backend.widget-properties.blur]
type = "int"
min = 0
max = 100
category = "Style"
description = "Blurs the widget itself"
[backend.widget-properties.backdrop_blur]
type = "int"
min = 0
max = 100
category = "Style"
description = "Blurs what lies behind the widget (frosted glass)"
[backend.widget-properties.alpha]
type = "float"
min = 0.0
max = 1.0
default = 1.0
category = "Style"
description = "Opacity of the whole widget (1 = opaque)"
[backend.widget-properties.rotate]
type = "int"
min = -360
max = 360
category = "Style"
description = "Rotation in degrees"
[backend.widget-properties.scale]
type = "float"
min = 0.05
max = 20.0
default = 1.0
category = "Style"
[backend.widget-properties.cursor]
type = "enum"
variants = ["Default", "Pointer", "Text", "Move", "Grab", "NotAllowed", "Crosshair", "Wait", "Help", "Progress"]
default = "Default"
category = "Style"
description = "Mouse cursor over the widget"
[backend.widget-properties.hover_background]
type = "color"
default = "#00000000"
category = "Animation"
description = "Background while the mouse is over it, faded in and out (alpha 0 = none)"
[backend.widget-properties.appear]
type = "enum"
variants = ["None", "Fade", "Slide", "Grow"]
default = "None"
category = "Animation"
description = "Animation when the widget appears"
[backend.widget-properties.animation_ms]
type = "int"
min = 0
max = 10000
default = 300
category = "Animation"
description = "Duration of hover, appear and move animations"
[backend.widget-properties.animate_moves]
type = "bool"
category = "Animation"
description = "Glide to a new place when the layout changes (freya Portal; needs a requested size in pixels)"
[backend.widget-properties.ripple]
type = "bool"
category = "Animation"
description = "Material Design ripple on click"

[backend.widget-events.on_hover]
params = [{ name = "inside", type = "bool" }]
description = "The mouse entered (true) or left (false) the widget"
[backend.widget-events.on_file_drop]
params = [{ name = "paths", type = "&[std::path::PathBuf]" }]
description = "Files were dropped on the widget"
[backend.widget-events.on_visible]
description = "The widget became visible (e.g. scrolled into view)"
[backend.widget-events.on_secondary_click]
description = "Right click on the widget"

[[backend.files]]
path = "FREYA.md"
owner = "user"
template-file = "templates/FREYA.md.j2"

# --- Kern-Widgets / core widgets ----------------------------------------------------------

[[extend]]
type = "core/Form"
[extend.properties.decorations]
type = "bool"
default = true
category = "Window"
description = "Title bar and frame of the system (off = borderless window)"
[extend.properties.custom_titlebar]
type = "bool"
category = "Window"
description = "freya title bar with minimize, maximize and close (for borderless windows)"
[extend.properties.transparent]
type = "bool"
category = "Window"
description = "Transparent window (only the background colour of the form shows)"
[extend.properties.icon]
type = "text"
category = "Window"
description = "PNG file of the window icon, relative to the project folder (built in)"
[extend.properties.scale_factor]
type = "float"
min = 0.0
max = 10.0
default = 1.0
category = "Window"
description = "Extra zoom of the whole window (1 = as the system)"
[extend.properties.app_id]
type = "text"
category = "Window"
description = "Application id for the window manager (Linux)"
[extend.properties.zoom_shortcuts]
type = "bool"
category = "freya"
description = "Ctrl/Cmd + plus, minus, 0 zoom the window"
[extend.properties.devtools]
type = "bool"
category = "freya"
description = "Enables freya's devtools (run the freya devtools app alongside)"
[extend.properties.metrics]
type = "bool"
category = "freya"
description = "Metrics overlay of freya in debug builds"
[extend.properties.hot_reload]
type = "bool"
category = "freya"
description = "Hot reload through `dx` (dioxus-cli)"
[extend.properties.radio]
type = "bool"
category = "freya"
description = "freya-radio for global state in own code (`freya::radio`)"
[extend.properties.query]
type = "bool"
category = "freya"
description = "freya-query for cached async data in own code (`freya::query`)"
[extend.properties.sdk]
type = "bool"
category = "freya"
description = "freya-sdk with Tokio helpers in own code (`freya::sdk`)"
[extend.codegen]
type = "crate::app::Control<()>"
init = "crate::app::Control::new(()).with_caption({{ rust.title }}).with_state({{ rust.enabled }}, true, {{ rust.tooltip }})"

[[extend]]
type = "core/Container"
[extend.codegen]
type = "crate::app::Control<()>"
init = "crate::app::Control::new(()).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[extend]]
type = "core/Label"
[extend.codegen]
type = "crate::app::Control<String>"
init = "crate::app::Control::new({{ rust.text }}.to_string()).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[extend]]
type = "core/Button"
[extend.properties.variant]
type = "enum"
variants = ["Normal", "Filled", "Outline", "Flat"]
default = "Normal"
category = "Appearance"
description = "freya button style"
[extend.properties.compact]
type = "bool"
category = "Appearance"
description = "Less padding"
[extend.codegen]
type = "crate::app::Control<()>"
init = "crate::app::Control::new(()).with_caption({{ rust.caption }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[extend]]
type = "core/Edit"
[extend.properties.variant]
type = "enum"
variants = ["Normal", "Filled", "Flat"]
default = "Normal"
category = "Appearance"
description = "freya input style"
[extend.properties.max_length]
type = "int"
min = 0
default = 0
category = "Behavior"
description = "Maximum number of characters (0 = no limit)"
[extend.codegen]
type = "crate::app::Control<String>"
init = "crate::app::Control::new({{ rust.text }}.to_string()).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[extend]]
type = "core/CheckBox"
[extend.codegen]
type = "crate::app::Control<bool>"
init = "crate::app::Control::new({{ rust.checked }}).with_caption({{ rust.caption }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[extend]]
type = "core/ImageBox"
[extend.codegen]
type = "crate::app::Control<crate::app::Picture>"
init = "crate::app::Control::new(crate::app::Picture::new({{ rust.file }}, {{ rust.fit }}, {{ rust.gamma }}, {{ rust.opacity }})).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[extend]]
type = "core/ImageScrollBox"
[extend.list]
set-items = """
self.{{ name }}.value.load(&items);
self.{{ name }}.items = items;
"""
selected = """self.{{ name }}.value.selected"""
[extend.codegen]
type = "crate::app::Control<crate::app::Gallery>"
init = "crate::app::Control::new(crate::app::Gallery::new({{ rust.orientation }}, {{ rust.thumb_size }}, {{ rust.spacing }}, {{ rust.fit }}, {{ rust.gamma }}, {{ rust.opacity }}).loaded(&{{ rust.images }})).with_items::<&str>({{ rust.images }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

# --- freya-Palette / freya palette ----------------------------------------------------------

[[component]]
name = "RadioButton"
kind = "widget"
look = "radio"
category = "freya"
icon = "radio"
description = "Option button; radio buttons in the same container form a group"
[component.properties.caption]
