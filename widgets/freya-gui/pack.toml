# freya – UI-Backend für Zielprojekte / UI backend for target projects
#
# Freya (https://freyaui.dev, Marc Espín, MIT) ist ein eigenständiges Projekt und hat
# nichts mit Freya TDE zu tun; Freya TDE unterstützt es nur als UI-Backend.
# Freya (https://freyaui.dev, by Marc Espín, MIT) is an independent project and has
# nothing to do with Freya TDE; Freya TDE only supports it as a UI backend.
#
# Reaktiv wie React: der Zustand des Formulars liegt in `Rc<RefCell<…>>`, jedes Widget
# ist ein Feld `crate::app::Control<T>`; eine Eingabe wird eine Nachricht
# (`main_form::Message`), `update` ändert den Zustand und ruft die Handler, danach
# zeichnet freya neu. Die Oberfläche baut `freya_view` mit den Elementen von freya.
# Reactive: the form state lives in `Rc<RefCell<…>>`; every input becomes a message,
# `update` changes the state and calls the handlers, then freya renders again.

[pack]
name = "freya-gui"
version = "0.1.0"
kind = "backend"
title = "freya"
description = "freya (freyaui.dev): declarative Rust GUI powered by Skia (Linux, Windows, macOS); an independent project, see the notice"
authors = ["Dragon Software <info@dragon-software.net>"]
license = "MIT OR Apache-2.0"
generated-code-license = "MIT OR Apache-2.0"
license-notice = """
freya (https://freyaui.dev) is an independent open-source project by Marc Espín
(github.com/marc2332/freya). It has nothing to do with Freya TDE: despite the similar
name, Freya TDE is neither part of freya nor made, endorsed or supported by its authors.
Freya TDE only supports freya as one of its UI backends.

freya is licensed under the MIT license. Only your generated project depends on it;
Freya TDE does not use freya itself. The code generated by Freya TDE is yours
(MIT OR Apache-2.0).

Questions about freya itself: https://freyaui.dev and https://github.com/marc2332/freya
"""

[backend]
event-loop = "main-thread"
absolute-positioning = true
platforms = ["linux", "windows", "macos"]
cargo = [
  { crate = "freya", version = "0.5.4" },
  { crate = "futures-channel", version = "0.3" },
  { crate = "futures-util", version = "0.3" },
]
app-file = "templates/app.rs.j2"
form-file = "templates/form.rs.j2"
run-file = "templates/run.rs.j2"

[[backend.files]]
path = "FREYA.md"
owner = "user"
template-file = "templates/FREYA.md.j2"

# --- Kern-Widgets / core widgets ----------------------------------------------------------

[[extend]]
type = "core/Form"
[extend.codegen]
type = "crate::app::Control<()>"
init = "crate::app::Control::new(()).with_caption({{ rust.title }}).with_state({{ rust.enabled }}, true, {{ rust.tooltip }})"

[[extend]]
type = "core/Container"
[extend.codegen]
type = "crate::app::Control<()>"
init = "crate::app::Control::new(()).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[extend]]
type = "core/Label"
[extend.codegen]
type = "crate::app::Control<String>"
init = "crate::app::Control::new({{ rust.text }}.to_string()).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[extend]]
type = "core/Button"
[extend.codegen]
type = "crate::app::Control<()>"
init = "crate::app::Control::new(()).with_caption({{ rust.caption }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[extend]]
type = "core/Edit"
[extend.properties.max_length]
type = "int"
min = 0
default = 0
category = "Behavior"
description = "Maximum number of characters (0 = no limit)"
[extend.codegen]
type = "crate::app::Control<String>"
init = "crate::app::Control::new({{ rust.text }}.to_string()).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[extend]]
type = "core/CheckBox"
[extend.codegen]
type = "crate::app::Control<bool>"
init = "crate::app::Control::new({{ rust.checked }}).with_caption({{ rust.caption }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[extend]]
type = "core/ImageBox"
[extend.codegen]
type = "crate::app::Control<crate::app::Picture>"
init = "crate::app::Control::new(crate::app::Picture::new({{ rust.file }}, {{ rust.fit }}, {{ rust.gamma }}, {{ rust.opacity }})).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[extend]]
type = "core/ImageScrollBox"
[extend.list]
set-items = """
self.{{ name }}.value.load(&items);
self.{{ name }}.items = items;
"""
selected = """self.{{ name }}.value.selected"""
[extend.codegen]
type = "crate::app::Control<crate::app::Gallery>"
init = "crate::app::Control::new(crate::app::Gallery::new({{ rust.orientation }}, {{ rust.thumb_size }}, {{ rust.spacing }}, {{ rust.fit }}, {{ rust.gamma }}, {{ rust.opacity }}).loaded(&{{ rust.images }})).with_items::<&str>({{ rust.images }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

# --- freya-Palette / freya palette ----------------------------------------------------------

[[component]]
name = "RadioButton"
kind = "widget"
look = "radio"
category = "freya"
icon = "radio"
description = "Option button; radio buttons in the same container form a group"
[component.properties.caption]
type = "text"
default = "Option"
category = "Appearance"
[component.properties.checked]
type = "bool"
category = "Behavior"
[component.events.on_toggle]
params = [{ name = "checked", type = "bool" }]
description = "Chosen by the user"
[component.codegen]
type = "crate::app::Control<bool>"
init = "crate::app::Control::new({{ rust.checked }}).with_caption({{ rust.caption }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[component]]
name = "Switch"
kind = "widget"
look = "switch"
category = "freya"
icon = "switch"
description = "On/off switch with optional caption"
[component.properties.caption]
type = "text"
category = "Appearance"
[component.properties.active]
type = "bool"
category = "Behavior"
[component.events.on_toggle]
params = [{ name = "active", type = "bool" }]
[component.codegen]
type = "crate::app::Control<bool>"
init = "crate::app::Control::new({{ rust.active }}).with_caption({{ rust.caption }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[component]]
name = "Slider"
kind = "widget"
look = "slider"
category = "freya"
icon = "slider"
description = "Slider to choose a value"
[component.properties.value]
type = "float"
category = "Value"
[component.properties.minimum]
type = "float"
category = "Value"
[component.properties.maximum]
type = "float"
default = 100.0
category = "Value"
[component.properties.step]
type = "float"
default = 1.0
category = "Value"
[component.properties.show_value]
type = "bool"
default = true
category = "Appearance"
description = "Show the current value next to the slider"
[component.events.on_change]
params = [{ name = "value", type = "f64" }]
[component.codegen]
type = "crate::app::Control<f64>"
init = "crate::app::Control::new({{ rust.value }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[component]]
name = "ProgressBar"
kind = "widget"
look = "progress"
category = "freya"
icon = "progress"
description = "Shows the progress of a task"
[component.properties.fraction]
type = "float"
min = 0.0
max = 1.0
category = "Value"
description = "Progress from 0.0 to 1.0"
[component.properties.text]
type = "text"
category = "Appearance"
description = "Text above the bar (empty = none)"
[component.codegen]
type = "crate::app::Control<f32>"
init = "crate::app::Control::new({{ rust.fraction }} as f32).with_caption({{ rust.text }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[component]]
name = "Select"
kind = "widget"
look = "dropdown"
category = "freya"
icon = "dropdown"
description = "Choose one entry from a list"
[component.properties.items]
type = "list"
item = "text"
category = "Value"
description = "The entries"
[component.properties.selected]
type = "int"
min = 0
category = "Value"
description = "Index of the selected entry"
[component.events.on_select]
params = [{ name = "index", type = "u32" }]
[component.list]
set-items = """
self.{{ name }}.items = items;
"""
selected = """(self.{{ name }}.value < self.{{ name }}.items.len()).then_some(self.{{ name }}.value)"""
[component.codegen]
type = "crate::app::Control<usize>"
init = "crate::app::Control::new({{ props.selected }}usize).with_items::<&str>({{ rust.items }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[component]]
name = "ListBox"
kind = "widget"
look = "list"
category = "freya"
icon = "list"
description = "List of text entries to choose from"
[component.properties.items]
type = "list"
item = "text"
category = "Value"
[component.properties.selected]
type = "int"
min = -1
default = -1
category = "Value"
description = "Index of the selected entry (-1 = none)"
[component.events.on_select]
params = [{ name = "index", type = "i32" }]
description = "Selection changed"
[component.list]
set-items = """
self.{{ name }}.items = items;
"""
selected = """usize::try_from(self.{{ name }}.value).ok()"""
[component.codegen]
type = "crate::app::Control<i32>"
init = "crate::app::Control::new({{ props.selected }}i32).with_items::<&str>({{ rust.items }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[component]]
name = "TextEdit"
kind = "widget"
look = "memo"
category = "freya"
icon = "memo"
description = "Multi-line text"
[component.properties.text]
type = "text"
category = "Appearance"
[component.properties.rows]
type = "int"
min = 1
default = 4
category = "Appearance"
description = "Visible lines"
[component.properties.read_only]
type = "bool"
category = "Behavior"
[component.events.on_change]
params = [{ name = "text", type = "&str" }]
[component.codegen]
type = "crate::app::Control<String>"
init = "crate::app::Control::new({{ rust.text }}.to_string()).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[component]]
name = "Separator"
kind = "widget"
look = "separator"
category = "freya"
icon = "separator"
description = "A line between widgets"
[component.properties.vertical]
type = "bool"
category = "Appearance"
[component.codegen]
type = "crate::app::Control<()>"
init = "crate::app::Control::new(()).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[component]]
name = "Card"
kind = "container"
look = "frame"
category = "freya"
icon = "frame"
description = "Container with a border and a title"
[component.properties.title]
type = "text"
default = "Group"
category = "Appearance"
[component.codegen]
type = "crate::app::Control<()>"
init = "crate::app::Control::new(()).with_caption({{ rust.title }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[component]]
name = "Tabs"
kind = "container"
look = "tabs"
category = "freya"
icon = "tabs"
description = "Pages with tabs; every child is one page (usually a Container)"
[component.properties.pages]
type = "list"
item = "text"
category = "Appearance"
description = "Tab titles, one per child (missing ones: the child's name)"
[component.properties.page]
type = "int"
min = 0
category = "Behavior"
description = "The page shown at the start (and in the designer)"
[component.events.on_page]
params = [{ name = "page", type = "u32" }]
[component.codegen]
type = "crate::app::Control<usize>"
init = "crate::app::Control::new({{ props.page }}usize).with_items::<&str>({{ rust.pages }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[component]]
name = "DataGrid"
kind = "widget"
look = "table"
category = "freya"
icon = "table"
description = "Table filled from a data source: one row per record, click selects"
[component.events.on_select]
params = [{ name = "index", type = "i32" }]
description = "Selected row changed (-1 = none); the row: `self.<name>_selected_row()`"
[component.table]
set-rows = """
self.{{ name }}.value = crate::app::Table { headers, rows, ..Default::default() };
"""
selected = "self.{{ name }}.value.selected"
select = "self.{{ name }}.value.selected = index;"
[component.codegen]
type = "crate::app::Control<crate::app::Table>"
init = "crate::app::Control::new(crate::app::Table::default()).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[component]]
name = "Link"
kind = "widget"
look = "link"
category = "freya"
icon = "link"
description = "Opens a web address in the browser"
[component.properties.uri]
type = "text"
default = "https://freyaui.dev"
category = "Behavior"
[component.properties.caption]
type = "text"
category = "Appearance"
description = "Text (empty = the address)"
[component.codegen]
type = "crate::app::Control<String>"
init = "crate::app::Control::new({{ rust.uri }}.to_string()).with_caption({{ rust.caption }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[component]]
name = "MainMenu"
look = "menubar"
category = "freya"
icon = "menu"
description = "Menu bar of the window: entries like `File/Open | Ctrl+O`, `File/-` (separator)"
[component.properties.items]
type = "list"
item = "text"
category = "Menu"
description = "One entry per line: path with `/`, optional `| shortcut`, `-` = separator"
[component.events.on_select]
params = [{ name = "item", type = "&str" }]
description = "An entry was chosen; `item` is its path, e.g. `File/Open`"
[component.codegen]
type = "crate::app::Control<Option<usize>>"
init = "crate::app::Control::new(None::<usize>).with_items::<&str>({{ rust.items }})"
