look = "slider"
category = "freya"
icon = "slider"
description = "Slider to choose a value"
[component.properties.value]
type = "float"
category = "Value"
[component.properties.minimum]
type = "float"
category = "Value"
[component.properties.maximum]
type = "float"
default = 100.0
category = "Value"
[component.properties.step]
type = "float"
default = 1.0
category = "Value"
[component.properties.show_value]
type = "bool"
default = true
category = "Appearance"
description = "Show the current value next to the slider"
[component.events.on_change]
params = [{ name = "value", type = "f64" }]
[component.codegen]
type = "crate::app::Control<f64>"
init = "crate::app::Control::new({{ rust.value }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[component]]
name = "ProgressBar"
kind = "widget"
look = "progress"
category = "freya"
icon = "progress"
description = "Shows the progress of a task"
[component.properties.fraction]
type = "float"
min = 0.0
max = 1.0
category = "Value"
description = "Progress from 0.0 to 1.0"
[component.properties.text]
type = "text"
category = "Appearance"
description = "Text above the bar (empty = none)"
[component.codegen]
type = "crate::app::Control<f32>"
init = "crate::app::Control::new({{ rust.fraction }} as f32).with_caption({{ rust.text }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[component]]
name = "Select"
kind = "widget"
look = "dropdown"
category = "freya"
icon = "dropdown"
description = "Choose one entry from a list"
[component.properties.items]
type = "list"
item = "text"
category = "Value"
description = "The entries"
[component.properties.selected]
type = "int"
min = 0
category = "Value"
description = "Index of the selected entry"
[component.events.on_select]
params = [{ name = "index", type = "u32" }]
[component.list]
set-items = """
self.{{ name }}.items = items;
"""
selected = """(self.{{ name }}.value < self.{{ name }}.items.len()).then_some(self.{{ name }}.value)"""
[component.codegen]
type = "crate::app::Control<usize>"
init = "crate::app::Control::new({{ props.selected }}usize).with_items::<&str>({{ rust.items }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[component]]
name = "ListBox"
kind = "widget"
look = "list"
category = "freya"
icon = "list"
description = "List of text entries to choose from"
[component.properties.items]
type = "list"
item = "text"
category = "Value"
[component.properties.selected]
type = "int"
min = -1
default = -1
category = "Value"
description = "Index of the selected entry (-1 = none)"
[component.events.on_select]
params = [{ name = "index", type = "i32" }]
description = "Selection changed"
[component.list]
set-items = """
self.{{ name }}.items = items;
"""
selected = """usize::try_from(self.{{ name }}.value).ok()"""
[component.codegen]
type = "crate::app::Control<i32>"
init = "crate::app::Control::new({{ props.selected }}i32).with_items::<&str>({{ rust.items }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[component]]
name = "TextEdit"
