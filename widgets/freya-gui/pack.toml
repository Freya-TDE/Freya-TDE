category = "Behavior"
[component.events.on_change]
params = [{ name = "text", type = "&str" }]
[component.codegen]
type = "crate::app::Control<String>"
init = "crate::app::Control::new({{ rust.text }}.to_string()).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[component]]
name = "Separator"
kind = "widget"
look = "separator"
category = "freya"
icon = "separator"
description = "A line between widgets"
[component.properties.vertical]
type = "bool"
category = "Appearance"
[component.codegen]
type = "crate::app::Control<()>"
init = "crate::app::Control::new(()).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[component]]
name = "Card"
kind = "container"
look = "frame"
category = "freya"
icon = "frame"
description = "Container with a border and a title"
[component.properties.title]
type = "text"
default = "Group"
category = "Appearance"
[component.codegen]
type = "crate::app::Control<()>"
init = "crate::app::Control::new(()).with_caption({{ rust.title }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[component]]
name = "Tabs"
kind = "container"
look = "tabs"
category = "freya"
icon = "tabs"
description = "Pages with tabs; every child is one page (usually a Container)"
[component.properties.pages]
type = "list"
item = "text"
category = "Appearance"
description = "Tab titles, one per child (missing ones: the child's name)"
[component.properties.page]
type = "int"
min = 0
category = "Behavior"
description = "The page shown at the start (and in the designer)"
[component.events.on_page]
params = [{ name = "page", type = "u32" }]
[component.codegen]
type = "crate::app::Control<usize>"
init = "crate::app::Control::new({{ props.page }}usize).with_items::<&str>({{ rust.pages }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[component]]
name = "DataGrid"
