# WebView – UI-Backend für Zielprojekte / UI backend for target projects
#
# Ein natives Fenster (tao) mit der System-WebView (wry: WebKitGTK unter Linux, WebView2
# unter Windows, WKWebView unter macOS). Das Formular wird eine HTML-Seite, die Layouts
# werden CSS (Flexbox, Grid, Prozent und Anker direkt als CSS-Werte); die Logik bleibt in
# Rust. Jedes Widget ist wie bei egui und Flutter ein Zustandsfeld
# `crate::app::Control<T>`; ein Handler ändert das Widget, indem er den Zustand ändert
# (`self.ok_button.enabled = false`), die Seite zeichnet danach neu.
#
# Austausch: Die Seite meldet Eingaben per IPC (`window.ipc.postMessage`), Rust übernimmt
# sie in den Zustand, ruft den Handler und schickt den neuen Zustand per
# `evaluate_script("freya.render(…)")` zurück. Aussehen: `style` am Formular – Native
# (eigenes schlichtes CSS, folgt Hell/Dunkel des Systems) oder Pico (Pico CSS, MIT,
# eingebettet).
#
# A native window (tao) with the system web view (wry). The form becomes an HTML page,
# layouts become CSS; the logic stays in Rust (`Control<T>` state fields). Input arrives
# through IPC, the new state goes back through `evaluate_script`. Look: `style` on the
# form – Native (own CSS) or Pico (Pico CSS, embedded).

[pack]
name = "webview"
version = "0.1.0"
kind = "backend"
description = "Native window with the system web view (wry + tao): the form as HTML/CSS, the logic in Rust; Linux, Windows, macOS"
authors = ["Dragon Software <info@dragon-software.net>"]
license = "MIT OR Apache-2.0"
generated-code-license = "MIT OR Apache-2.0"

[backend]
event-loop = "main-thread"
absolute-positioning = true
platforms = ["linux", "windows", "macos"]
cargo = [
    { crate = "wry", version = "0.57" },
    { crate = "tao", version = "0.37" },
    { crate = "serde_json", version = "1.0.154" },
]
app-file = "templates/app.rs.j2"
form-file = "templates/form.rs.j2"
run-file = "templates/run.rs.j2"

# Pico CSS als Rust-Konstante (eine eigene .css bekäme den Generator-Kopf als
# Rust-Kommentar). / Pico CSS as a Rust constant.
[[backend.files]]
path = "src/freya_pico.gen.rs"
raw = true
template-file = "assets/pico.rs"

# --- Kern-Widgets / core widgets ----------------------------------------------------------

[[extend]]
type = "core/Form"
[extend.properties.style]
type = "enum"
variants = ["Native", "Pico"]
category = "Appearance"
description = "Look of the widgets: Native (own plain CSS, follows the system's light/dark) or Pico (Pico CSS)"
[extend.codegen]
type = "crate::app::Control<()>"
init = "crate::app::Control::new(()).with_caption({{ rust.title }}).with_state({{ rust.enabled }}, true, {{ rust.tooltip }})"

[[extend]]
type = "core/Container"
[extend.codegen]
type = "crate::app::Control<()>"
init = "crate::app::Control::new(()).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[extend]]
type = "core/Label"
[extend.codegen]
type = "crate::app::Control<String>"
init = "crate::app::Control::new({{ rust.text }}.to_string()).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[extend]]
type = "core/Button"
[extend.codegen]
type = "crate::app::Control<()>"
init = "crate::app::Control::new(()).with_caption({{ rust.caption }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[extend]]
type = "core/Edit"
[extend.properties.max_length]
type = "int"
min = 0
default = 0
category = "Behavior"
description = "Maximum number of characters (0 = no limit)"
[extend.codegen]
type = "crate::app::Control<String>"
init = "crate::app::Control::new({{ rust.text }}.to_string()).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[extend]]
type = "core/CheckBox"
[extend.codegen]
type = "crate::app::Control<bool>"
init = "crate::app::Control::new({{ rust.checked }}).with_caption({{ rust.caption }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[extend]]
type = "core/ImageBox"
[extend.codegen]
type = "crate::app::Control<crate::app::Picture>"
init = "crate::app::Control::new(crate::app::Picture::new({{ rust.file }}, {{ rust.gamma }}, {{ rust.opacity }})).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

[[extend]]
type = "core/ImageScrollBox"
[extend.list]
set-items = """
self.{{ name }}.value.load(&items);
self.{{ name }}.items = items;
"""
selected = """self.{{ name }}.value.selected"""
[extend.codegen]
type = "crate::app::Control<crate::app::Gallery>"
init = "crate::app::Control::new(crate::app::Gallery::new({{ rust.gamma }}, {{ rust.opacity }}).loaded(&{{ rust.images }})).with_items::<&str>({{ rust.images }}).with_state({{ rust.enabled }}, {{ rust.visible }}, {{ rust.tooltip }})"

# --- WebView-Palette / WebView palette ----------------------------------------------------

[[component]]
name = "RadioButton"
