# Theme-/Metrik-Tabelle für windows – optische Anpassungen hier, nicht im Code.
# Theme and metric table for windows – optical adjustments here, not in code.
name = "windows"
font-size = 13
char-width = 0.55
title-bar-height = 31
padding = 10
spacing = 6
radius = 4
check-size = 16
tray-height = 64
icon-size = 28
margin = 24

[colors]
desktop = "#dcdcdc"
window = "#f3f3f3"
window-border = "#a0a0a0"
title-bar = "#ffffff"
title-text = "#1a1a1a"
control = "#fbfbfb"
control-border = "#d0d0d0"
input = "#ffffff"
text = "#1a1a1a"
disabled-text = "#a0a0a0"
placeholder = "#8a8a8a"
accent = "#0067c0"
container-border = "#b4b4b4"
selection = "#0067c0"
tray = "#ececec"

[widgets."core/Button"]
height = 32
min-width = 80
padding-x = 14

[widgets."core/Label"]
height = 22
min-width = 20
padding-x = 0

[widgets."core/Edit"]
height = 32
min-width = 160
padding-x = 8

[widgets."core/CheckBox"]
height = 24
min-width = 24
padding-x = 0

[widgets."core/Container"]
height = 60
min-width = 100
padding-x = 0

# --- GTK 4 (widgets/gtk4) – sieht auf allen Systemen gleich aus / looks the same everywhere
[widgets."backend:gtk4/RadioButton"]
height = 24
min-width = 24
padding-x = 0

[widgets."backend:gtk4/Switch"]
height = 26
min-width = 48
padding-x = 0

[widgets."backend:gtk4/SpinButton"]
height = 34
min-width = 120
padding-x = 8

[widgets."backend:gtk4/Scale"]
height = 30
min-width = 120
padding-x = 0

[widgets."backend:gtk4/ProgressBar"]
height = 20
min-width = 120
padding-x = 0

[widgets."backend:gtk4/DropDown"]
height = 34
min-width = 120
padding-x = 10

[widgets."backend:gtk4/TextView"]
height = 100
min-width = 160
padding-x = 6

[widgets."backend:gtk4/Frame"]
height = 80
min-width = 120
padding-x = 0

[widgets."backend:gtk4/Image"]
height = 64
min-width = 64
padding-x = 0

[widgets."backend:gtk4/Separator"]
height = 5
min-width = 20
padding-x = 0

[widgets."backend:gtk4/LinkButton"]
height = 34
min-width = 60
padding-x = 14
