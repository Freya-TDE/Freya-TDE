# Theme-/Metrik-Tabelle für linux – optische Anpassungen hier, nicht im Code.
# Theme and metric table for linux – optical adjustments here, not in code.
name = "linux"
font-size = 14
char-width = 0.55
title-bar-height = 38
padding = 12
spacing = 8
radius = 6
check-size = 16
tray-height = 64
