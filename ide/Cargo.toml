[package]
name = "freya-tde"
description = "Freya TDE: visual development environment for Rust (RAD, Delphi/Lazarus style)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["rad", "gui", "designer", "ide"]
categories = ["development-tools", "gui"]

[[bin]]
name = "freya-tde"
path = "src/main.rs"

[dependencies]
tdr-core.workspace = true
tdr-designer.workspace = true
ruf = { path = "../RUF/crates/ruf", version = "0.3.1" }
rncl = { path = "../RUF/crates/rncl", version = "0.3.1" }
serde.workspace = true
toml.workspace = true
serde_json.workspace = true
# Löschen in den Papierkorb (Linux, Windows, macOS). / Delete into the trash.
trash = "5.2.9"
# Terminal im Panel: Pseudo-Terminal (auch Windows ConPTY) und Terminal-Parser.
# Terminal in the panel: pseudo terminal (incl. Windows ConPTY) and terminal parser.
portable-pty = "0.9.0"
vt100 = "0.18.1"
# API-Keys der KI im Schlüsselbund des Systems (Secret Service, Keychain, Windows).
# AI API keys in the system keyring.
keyring = "4.2.0"
thiserror.workspace = true
# Code-Vervollständigung: Zeilen der Methoden im impl-Block (span-locations).
syn.workspace = true
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
# KI-Anbieter (HTTP, synchron in Hintergrund-Threads, rustls). / AI providers.
ureq = { version = "3.5.2", features = ["json"] }
# Prüfsummen freigegebener Projekt-Skills. / Checksums of approved project skills.
sha2 = "0.11.1"
# Signatur der Skill-Pakete prüfen (Ed25519). / Verify signed skill packs.
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast"] }

[[test]]
name = "ui"
harness = false

[build-dependencies]
# Programmsymbol in der Windows-.exe (build.rs; auf anderen Systemen ungenutzt).
embed-resource = "3.0.12"

[target.'cfg(windows)'.dependencies]
# CLI-Ausgaben in die aufrufende Konsole (Programm ohne eigenes Konsolenfenster).
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }
